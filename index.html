<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ヘリ空輸時間検索</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">FLIGHT LOG BASED</div><h1>🚁 ヘリ空輸時間検索</h1><p>社内の過去飛行実績から、機種別の空輸時間を確認</p></header><section class="card"><div class="field"><label>機種</label><select id="aircraft"></select></div><div class="route-row"><div class="field"><label>出発地</label><div class="combo"><input id="from" placeholder="例：仙" autocomplete="off" autocorrect="off" spellcheck="false"><button id="clearFrom" class="clear-btn" type="button" aria-label="出発地を消す">×</button><div id="fromMenu" class="menu"></div></div></div><button id="swap" class="swap">⇄</button><div class="field"><label>目的地</label><div class="combo"><input id="to" placeholder="例：八尾" autocomplete="off" autocorrect="off" spellcheck="false"><button id="clearTo" class="clear-btn" type="button" aria-label="目的地を消す">×</button><div id="toMenu" class="menu"></div></div></div></div><div id="result" class="result"></div></section></main><script src="data.js"></script><script src="app.js"></script></body></html>
