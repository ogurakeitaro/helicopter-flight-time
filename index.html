<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ヘリ空輸時間検索</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">FLIGHT LOG BASED</div><h1>🚁 ヘリ空輸時間検索</h1><p>社内の過去飛行実績から、機種別の空輸時間を確認</p></header><section class="card"><div class="field"><label>機種</label><div class="combo"><input id="aircraft" placeholder="機種を選択" readonly inputmode="none"><div id="aircraftMenu" class="menu"></div></div></div><div class="route-row"><div class="field"><label>出発地</label><div class="combo"><input id="from" placeholder="例：仙" autocomplete="off" autocorrect="off" spellcheck="false"><div id="fromMenu" class="menu"></div></div></div><button id="swap" class="swap">⇄</button><div class="field"><label>目的地</label><div class="combo"><input id="to" placeholder="例：八尾" autocomplete="off" autocorrect="off" spellcheck="false"><div id="toMenu" class="menu"></div></div></div></div><div class="action-row"><button id="clearAll" class="action-btn" type="button">× 入力をクリア</button><button id="refreshPage" class="action-btn refresh" type="button">↻ ページを更新</button></div><div id="result" class="result"></div></section></main><script src="data.js"></script><script src="app.js"></script></body></html>
