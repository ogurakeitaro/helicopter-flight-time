<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>ヘリ空輸時間検索</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">FLIGHT LOG BASED</div><h1>🚁 ヘリ空輸時間検索</h1><p>社内の過去飛行実績から、機種別の空輸時間をすばやく確認</p></header><section class="card"><div class="field"><label>機種</label><select id="aircraft"></select></div><div class="route-row"><div class="field"><label>出発地</label><select id="from"><option>先に機種を選択</option></select></div><button id="swap" class="swap" aria-label="出発地と目的地を入れ替える">⇄</button><div class="field"><label>目的地</label><select id="to"><option>先に出発地を選択</option></select></div></div><div id="result" class="result"></div></section><div class="footer">過去実績に基づく参考値</div></main><script src="data.js"></script><script src="app.js"></script></body></html>
